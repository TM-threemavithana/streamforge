[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamforge-replay"
version = "0.1.0"
description = "Bounded NYC TLC Parquet adapter for StreamForge 2.0"
requires-python = ">=3.11"
dependencies = ["pyarrow>=15,<25"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
streamforge-inspect = "streamforge_replay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tools/replay-python/src/streamforge_replay"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tools/replay-python/tests"]

