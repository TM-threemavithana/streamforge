        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              {{- include "streamforge.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: kafka
      ports:
        - protocol: TCP
          port: 9092
    - ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "streamforge.fullname" . }}-analytics
  labels:
    {{- include "streamforge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "streamforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analytics
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "streamforge.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              {{- include "streamforge.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: kafka
      ports:
        - protocol: TCP
