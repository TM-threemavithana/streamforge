{{- if .Values.kafka.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "streamforge.fullname" . }}-kafka
  labels:
    {{- include "streamforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.kafka.service.port }}
      targetPort: 9092
      protocol: TCP
      name: kafka
    - port: 9093
      targetPort: 9093
      protocol: TCP
      name: controller
  selector:
    {{- include "streamforge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
{{- end }}
