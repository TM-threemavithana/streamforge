services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: streamforge
      POSTGRES_USER: streamforge
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:${STREAMFORGE_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamforge -d streamforge"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - streamforge-postgres:/var/lib/postgresql/data
      - ../../db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  streamforge-postgres:

