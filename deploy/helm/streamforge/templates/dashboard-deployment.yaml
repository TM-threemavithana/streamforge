{{- if .Values.dashboard.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streamforge.fullname" . }}-dashboard
  labels:
    {{- include "streamforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "streamforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "streamforge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ include "streamforge.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: STREAMFORGE_CORE_HOST
              value: "{{ include "streamforge.fullname" . }}-core"
            - name: STREAMFORGE_CORE_PORT
              value: "{{ .Values.core.service.httpPort }}"
            - name: STREAMFORGE_ALERTS_HOST
              value: "{{ include "streamforge.fullname" . }}-alerts"
            - name: STREAMFORGE_ALERTS_PORT
              value: "{{ .Values.alerts.service.port }}"
          livenessProbe:
            httpGet:
              path: {{ .Values.dashboard.probes.liveness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.dashboard.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.dashboard.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.dashboard.probes.readiness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.dashboard.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.dashboard.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
