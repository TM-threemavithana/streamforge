# Default values for streamforge.
# This is a YAML-formatted file.

global:
  environment: local
  clusterDomain: cluster.local

serviceAccount:
  create: true
  name: streamforge-sa
  automountServiceAccountToken: false

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

podSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

core:
  enabled: true
  replicaCount: 1
  image:
    repository: streamforge-core
    pullPolicy: IfNotPresent
    tag: "0.1.0"
  service:
    type: ClusterIP
    httpPort: 8080
    grpcPort: 50051
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  probes:
    liveness:
      path: /health/live
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
    readiness:
      path: /health/ready
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 2
  env:
    allowNonLoopback: "true"
    grpcAddr: "0.0.0.0:50051"
    httpAddr: "0.0.0.0:8080"
    kafkaTopic: "streamforge.raw-events.v1"
    kafkaConsumerGroup: "streamforge-analytics-v1"

analytics:
  enabled: true
  replicaCount: 1
  image:
    repository: streamforge-core
    pullPolicy: IfNotPresent
    tag: "0.1.0"
  command:
    - "/usr/local/bin/streamforge-analytics"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    kafkaTopic: "streamforge.raw-events.v1"
    kafkaConsumerGroup: "streamforge-analytics-v1"

alerts:
  enabled: true
  replicaCount: 1
  image:
    repository: streamforge-alerts
    pullPolicy: IfNotPresent
    tag: "0.1.0"
  service:
    type: ClusterIP
    port: 8081
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 512Mi
  probes:
    startup:
      path: /health/live
      initialDelaySeconds: 15
      periodSeconds: 5
      failureThreshold: 15
    liveness:
      path: /health/live
      periodSeconds: 10
      failureThreshold: 3
    readiness:
      path: /health/ready
      periodSeconds: 5
      failureThreshold: 2
  env:
    port: "8081"
    kafkaTopic: "streamforge.raw-events.v1"
    kafkaConsumerGroup: "streamforge-alerts-v1"

dashboard:
  enabled: true
  replicaCount: 1
  image:
    repository: streamforge-dashboard
    pullPolicy: IfNotPresent
    tag: "0.1.0"
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 3
      periodSeconds: 10
    readiness:
      path: /health
      initialDelaySeconds: 3
      periodSeconds: 5

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    enabled: true
    size: 5Gi
    accessMode: ReadWriteOnce
  auth:
    coreUser: "streamforge_user"
    corePassword: "streamforge_core_secure_password"
    coreDatabase: "streamforge"
    alertsUser: "streamforge_alerts_user"
    alertsPassword: "streamforge_alerts_secure_password"
    alertsDatabase: "streamforge_alerts"
    adminPassword: "postgres_admin_secure_password"
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 256Mi

kafka:
  enabled: true
  image:
    repository: apache/kafka
    tag: "3.8.0"
    pullPolicy: IfNotPresent
  service:
    port: 9092
  persistence:
    enabled: true
    size: 5Gi
    accessMode: ReadWriteOnce
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi

networkPolicy:
  enabled: true

prometheus:
  scrape: true
