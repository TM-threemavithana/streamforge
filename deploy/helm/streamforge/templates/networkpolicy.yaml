{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "streamforge.fullname" . }}-core
  labels:
    {{- include "streamforge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "streamforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 50051
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "streamforge.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              {{- include "streamforge.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: kafka
      ports:
        - protocol: TCP
          port: 9092
    - ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
