{{- if .Values.postgres.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "streamforge.fullname" . }}-postgres
  labels:
    {{- include "streamforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    {{- include "streamforge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- end }}
