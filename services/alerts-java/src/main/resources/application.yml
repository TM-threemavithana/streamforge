server:
  port: ${STREAMFORGE_ALERTS_PORT:8081}

spring:
  application:
    name: alerts-java
  datasource:
    url: ${STREAMFORGE_ALERTS_DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/streamforge_alerts}
    username: ${STREAMFORGE_ALERTS_DATABASE_USER:streamforge}
    password: ${STREAMFORGE_ALERTS_DATABASE_PASSWORD:local-development-only}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${STREAMFORGE_KAFKA_BROKERS:127.0.0.1:29092}
    consumer:
      group-id: streamforge-alerts-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      ack-mode: MANUAL
