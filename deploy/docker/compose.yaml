services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: streamforge
      POSTGRES_USER: streamforge
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:${STREAMFORGE_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamforge -d streamforge"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - streamforge-postgres:/var/lib/postgresql/data
      - ../../db/migrations:/docker-entrypoint-initdb.d:ro
      - ./init-alerts-db.sh:/docker-entrypoint-initdb.d/999_alerts_db.sh:ro

  kafka:
    image: apache/kafka:4.2.2
    hostname: kafka
    ports:
      - "127.0.0.1:${STREAMFORGE_KAFKA_PORT:-29092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://127.0.0.1:${STREAMFORGE_KAFKA_PORT:-29092},PLAINTEXT://kafka:19092
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - streamforge-kafka:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:4.2.2
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:19092
      - --create
      - --if-not-exists
      - --topic
      - streamforge.raw-events.v1
      - --partitions
      - "6"
      - --replication-factor
      - "1"
      - --config
      - retention.ms=604800000

  alerts-java:
    build:
      context: ../../services/alerts-java
      dockerfile: Dockerfile
    environment:
      STREAMFORGE_ALERTS_DATABASE_URL: jdbc:postgresql://postgres:5432/streamforge_alerts
      STREAMFORGE_ALERTS_DATABASE_USER: streamforge
      STREAMFORGE_ALERTS_DATABASE_PASSWORD: local-development-only
      STREAMFORGE_KAFKA_BROKERS: kafka:19092
      STREAMFORGE_KAFKA_TOPIC: streamforge.raw-events.v1
      STREAMFORGE_ALERTS_PORT: 8081
    ports:
      - "127.0.0.1:${STREAMFORGE_ALERTS_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  streamforge-postgres:
  streamforge-kafka:
